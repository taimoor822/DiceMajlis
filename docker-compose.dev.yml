# Local development services for Dice Majlis.
#   docker compose -f docker-compose.dev.yml up -d
# Matches the defaults in backend/core/core/settings.py and .env.example
# (DB_ENGINE=postgres, DB_NAME=dice_majlis, DB_USER/DB_PASSWORD=postgres).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dice_majlis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dice_majlis"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
