# Runs on every push and pull request. Both jobs must pass before merging.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dice_majlis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dice_majlis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_ENGINE: postgres
      DB_HOST: 127.0.0.1
      DB_PASSWORD: postgres
      CHANNEL_LAYER: memory
      DJANGO_DEBUG: "true"
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r ../requirements.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks
        run: python manage.py check
      - name: Tests (engine, API, sockets, turn timer)
        run: python manage.py test --verbosity 1

  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dice_majlis_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Same version the project is developed on (see README).
          flutter-version: 3.38.7
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Generated code is up to date (Freezed, JSON, translations)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          if [ -n "$(git status --porcelain -- lib/)" ]; then
            git status --short -- lib/
            echo "Generated files changed. Run build_runner and gen-l10n, then commit."
            exit 1
          fi
      - name: Analyze (warnings and errors fail; infos don't)
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test
